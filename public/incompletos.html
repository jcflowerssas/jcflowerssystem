<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabacos Incompletos - Tomates San Sebastián</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

    <!-- Barra de navegación inyectada automáticamente -->
    <div id="nav-container"></div>

    <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">
        <div class="flex items-center justify-between bg-amber-50 p-4 rounded-2xl border border-amber-200">
            <div>
                <h2 class="text-lg font-bold text-amber-900">Control de Tabacos Incompletos</h2>
                <p class="text-xs text-amber-700">Gestiona lotes pendientes de completar antes de pasarlos al inventario principal.</p>
            </div>
            <button onclick="abrirModalIncompleto()" class="px-4 py-2 bg-amber-700 hover:bg-amber-800 text-white font-bold rounded-lg text-sm shadow">+ Registrar Incompleto</button>
        </div>
        <div class="bg-white rounded-2xl shadow-sm overflow-hidden border border-slate-200">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-amber-100 text-amber-900 text-xs uppercase font-bold border-b">
                            <th class="p-4">Ubicación</th>
                            <th class="p-4">Bloque</th>
                            <th class="p-4">Variedad</th>
                            <th class="p-4">Grado</th>
                            <th class="p-4">Tallos Actuales</th>
                            <th class="p-4">Meta</th>
                            <th class="p-4">Faltantes</th>
                            <th class="p-4">Cortador</th>
                            <th class="p-4 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-incompletos-body"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
    <script src="js/incompletos.js"></script>
</body>
</html>
