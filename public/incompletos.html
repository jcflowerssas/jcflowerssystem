<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabacos Incompletos - JC Flowers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tema.js"></script>
    <meta name="theme-color" content="#163827">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

    <!-- Barra de navegación inyectada automáticamente -->
    <div id="nav-container"></div>

    <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">
        <div class="flex items-center justify-between bg-amber-50 p-4 rounded-2xl border border-amber-200">
            <div>
                <h2 class="text-lg font-bold text-amber-900">Control de Tabacos Incompletos</h2>
                <p class="text-xs text-amber-700">Gestiona lotes pendientes de completar antes de pasarlos al inventario principal.</p>
            </div>
            <div class="flex flex-wrap gap-2">
                <button type="button" onclick="abrirInformeIncompletos()" class="px-4 py-2 bg-white hover:bg-amber-100 text-amber-900 border border-amber-300 font-bold rounded-lg text-sm shadow">📋 Generar informe</button>
                <a href="index.html#incompletos" class="px-4 py-2 bg-amber-700 hover:bg-amber-800 text-white font-bold rounded-lg text-sm shadow">+ Registrar Incompleto</a>
            </div>
        </div>
        <div class="bg-white rounded-2xl shadow-sm overflow-hidden border border-slate-200">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-amber-100 text-amber-900 text-xs uppercase font-bold border-b">
                            <th class="p-4">Ubicación</th>
                            <th class="p-4">Bloque</th>
                            <th class="p-4">Variedad</th>
                            <th class="p-4">Grado</th>
                            <th class="p-4">Tallos Actuales</th>
                            <th class="p-4">Meta</th>
                            <th class="p-4">Faltantes</th>
                            <th class="p-4">Cortador</th>
                            <th class="p-4 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-incompletos-body"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- INFORME PARA COMPLETAR TABACOS -->
    <div id="modal-informe" class="hidden fixed inset-0 bg-slate-900/50 flex items-start justify-center z-50 p-4 overflow-y-auto">
        <div class="bg-white rounded-2xl p-6 max-w-3xl w-full shadow-xl space-y-4 my-6">
            <div id="area-informe" class="space-y-4"></div>
            <div class="flex flex-wrap justify-end gap-2 border-t pt-3">
                <button type="button" onclick="cerrarInforme()" class="px-4 py-2 bg-gray-200 rounded-lg text-sm font-bold">Cerrar</button>
                <button type="button" onclick="copiarInforme()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-sm font-bold">Copiar texto</button>
                <button type="button" onclick="window.print()" class="px-4 py-2 bg-amber-700 hover:bg-amber-800 text-white rounded-lg text-sm font-bold">Imprimir</button>
            </div>
        </div>
    </div>
    <style>
        @media print {
            body * { visibility: hidden; }
            #area-informe, #area-informe * { visibility: visible; }
            #area-informe { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>

    <script src="js/main.js"></script>
    <script src="js/incompletos.js"></script>
</body>
</html>
